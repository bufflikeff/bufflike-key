<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Trang nhận key BuffLike an toàn dành cho người dùng đến từ bot Telegram."
    />
    <meta name="theme-color" content="#f3f1e9" />
    <title>BuffLike · Nhận key</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f3f1e9;
        color: #123d39;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        background:
          radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.9), transparent 31rem),
          radial-gradient(circle at 90% 90%, rgba(221, 231, 218, 0.72), transparent 30rem),
          #f3f1e9;
      }

      .portal {
        width: min(100%, 520px);
        overflow: hidden;
        border: 1px solid rgba(18, 61, 57, 0.14);
        border-radius: 28px;
        background: rgba(255, 255, 252, 0.86);
        box-shadow: 0 24px 80px rgba(22, 53, 48, 0.12);
      }

      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid rgba(18, 61, 57, 0.12);
        color: #58716c;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .live-mark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #39756c;
        letter-spacing: 0.08em;
      }

      .live-mark::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e2824c;
        content: "";
        box-shadow: 0 0 0 4px rgba(226, 130, 76, 0.13);
      }

      .content {
        padding: 36px 28px 30px;
      }

      .kicker {
        margin: 0 0 12px;
        color: #e2824c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #123d39;
        font-size: clamp(30px, 7vw, 42px);
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      .intro {
        max-width: 390px;
        margin: 14px 0 28px;
        color: #637873;
        font-size: 15px;
        line-height: 1.65;
      }

      .status-card {
        min-height: 126px;
        padding: 20px;
        border: 1px solid rgba(18, 61, 57, 0.13);
        border-radius: 18px;
        background: #f7f7f1;
      }

      .status-heading {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }

      .status-icon {
        display: grid;
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 12px;
        background: #e5eee8;
        color: #38766c;
        font-size: 20px;
        font-weight: 700;
      }

      .status-card[data-state="error"] .status-icon {
        background: #f9e8dd;
        color: #b9552b;
      }

      .status-card[data-state="success"] .status-icon {
        background: #e5eee8;
        color: #28665c;
      }

      .status-title {
        margin: 2px 0 5px;
        color: #123d39;
        font-size: 15px;
        font-weight: 750;
        line-height: 1.4;
      }

      .status-copy {
        margin: 0;
        color: #667b76;
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .spinner {
        width: 17px;
        height: 17px;
        margin: 8px 0 0 49px;
        border: 2px solid rgba(56, 118, 108, 0.2);
        border-top-color: #38766c;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .key-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 18px;
        padding: 14px 14px 14px 18px;
        border: 1px solid rgba(18, 61, 57, 0.16);
        border-radius: 16px;
        background: #fffefa;
      }

      .key-label {
        display: block;
        margin-bottom: 6px;
        color: #72837d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .key-value {
        color: #123d39;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      button {
        flex: 0 0 auto;
        min-height: 42px;
        padding: 0 15px;
        border: 0;
        border-radius: 11px;
        background: #123d39;
        color: white;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 140ms ease,
          background 140ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: #20564e;
      }

      button:focus-visible {
        outline: 3px solid rgba(226, 130, 76, 0.6);
        outline-offset: 3px;
      }

      .expiry {
        margin: 12px 2px 0;
        color: #70817b;
        font-size: 12px;
        line-height: 1.5;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 17px 24px;
        border-top: 1px solid rgba(18, 61, 57, 0.12);
        color: #85918c;
        font-size: 11px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 460px) {
        .content {
          padding: 30px 20px 24px;
        }

        .topline {
          padding: 18px 20px;
        }

        .key-box {
          align-items: stretch;
          flex-direction: column;
        }

        button {
          width: 100%;
        }

        .footer {
          padding: 16px 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="portal">
      <div class="topline">
        <span>BuffLike · Key Portal</span>
        <span class="live-mark">Secure session</span>
      </div>
      <section class="content" aria-labelledby="page-title">
        <p class="kicker">Telegram task exchange</p>
        <h1 id="page-title">Nhận key của bạn</h1>
        <p class="intro">
          Trang chỉ cấp key cho phiên nhiệm vụ hợp lệ được mở từ bot Telegram.
        </p>

        <div
          id="status-card"
          class="status-card"
          data-state="loading"
          role="status"
          aria-live="polite"
        >
          <div class="status-heading">
            <span id="status-icon" class="status-icon" aria-hidden="true">···</span>
            <div>
              <p id="status-title" class="status-title">Đang kiểm tra phiên</p>
              <p id="status-copy" class="status-copy">
                Vui lòng giữ trang mở trong giây lát.
              </p>
            </div>
          </div>
          <div id="spinner" class="spinner" aria-hidden="true"></div>
        </div>

        <div id="key-box" class="key-box hidden">
          <div>
            <span class="key-label">Dynamic key</span>
            <code id="key-value" class="key-value"></code>
          </div>
          <button id="copy-button" type="button">Sao chép key</button>
        </div>
        <p id="expiry" class="expiry hidden"></p>
      </section>
      <footer class="footer">
        <span>Phiên dùng một lần</span>
        <span>Key có hiệu lực 30 phút</span>
      </footer>
    </main>

    <script>
      // Replace this with the deployed API origin before uploading to GitHub Pages.
      // Example format: https://your-published-api-domain/api
      const API_BASE_URL = "https://REPLACE_WITH_YOUR_REPLIT_API_DOMAIN/api";

      const statusCard = document.getElementById("status-card");
      const statusIcon = document.getElementById("status-icon");
      const statusTitle = document.getElementById("status-title");
      const statusCopy = document.getElementById("status-copy");
      const spinner = document.getElementById("spinner");
      const keyBox = document.getElementById("key-box");
      const keyValue = document.getElementById("key-value");
      const expiry = document.getElementById("expiry");
      const copyButton = document.getElementById("copy-button");

      function showStatus(state, icon, title, copy) {
        statusCard.dataset.state = state;
        statusIcon.textContent = icon;
        statusTitle.textContent = title;
        statusCopy.textContent = copy;
        spinner.classList.add("hidden");
      }

      function showInvalidAccess() {
        showStatus(
          "error",
          "×",
          "❌ Truy cập không hợp lệ!",
          "Vui lòng mở link từ Bot Telegram để thực hiện nhiệm vụ.",
        );
      }

      function getApiBaseUrl() {
        const configured =
          window.BUFFLIKE_API_BASE_URL || API_BASE_URL;
        if (configured.includes("REPLACE_WITH_YOUR_REPLIT_API_DOMAIN")) {
          return null;
        }
        return configured.replace(/\/+$/, "");
      }

      async function postJson(apiBaseUrl, path, body) {
        const response = await fetch(`${apiBaseUrl}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          cache: "no-store",
        });
        const payload = await response.json().catch(() => ({}));
        return { response, payload };
      }

      async function start() {
        // Tự động bóc tách token bất chấp bên rút gọn link trả về kiểu gì (thiếu ?, thiếu =, hay dạng /token=)
        let token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            const href = window.location.href;
            const match = href.match(/token[=/]?([a-zA-Z0-9_-]+)/) || href.match(/token=([^&]+)/);
            if (match) {
                token = match[1];
            }
        }

        // Do not call any API when there is no token.
        if (!token) {
          showInvalidAccess();
          return;
        }

        const apiBaseUrl = getApiBaseUrl();
        if (!apiBaseUrl) {
          showStatus(
            "error",
            "!",
            "Trang chưa được cấu hình",
            "Hãy điền API_BASE_URL bằng URL API Replit đã xuất bản rồi tải lại trang.",
          );
          return;
        }

        try {
          const validation = await postJson(
            apiBaseUrl,
            "/session/validate",
            { token },
          );
          if (!validation.response.ok || validation.payload.valid !== true) {
            showInvalidAccess();
            return;
          }

          // The API consumes the token atomically. Never retry this request.
          const generated = await postJson(apiBaseUrl, "/generate-key", {
            token,
          });
          if (!generated.response.ok || !generated.payload.key) {
            showInvalidAccess();
            return;
          }

          history.replaceState({}, document.title, window.location.pathname);
          showStatus(
            "success",
            "✓",
            "Key đã sẵn sàng",
            `Nhiệm vụ ${validation.payload.taskNumber} đã được xác nhận. Hãy gửi key này về bot Telegram.`,
          );
          keyValue.textContent = generated.payload.key;
          keyBox.classList.remove("hidden");
          const expiresAt = new Date(generated.payload.expiresAt);
          expiry.textContent = `Key hết hạn lúc ${new Intl.DateTimeFormat(
            "vi-VN",
            {
              dateStyle: "short",
              timeStyle: "short",
              timeZone: "Asia/Ho_Chi_Minh",
            },
          ).format(expiresAt)} (giờ Việt Nam).`;
          expiry.classList.remove("hidden");
        } catch {
          showStatus(
            "error",
            "!",
            "Không thể kết nối API",
            "Hãy kiểm tra cấu hình API hoặc mở lại link nhiệm vụ trong bot Telegram.",
          );
        }
      }

      copyButton.addEventListener("click", async () => {
        const key = keyValue.textContent || "";
        try {
          await navigator.clipboard.writeText(key);
          copyButton.textContent = "Đã sao chép";
          window.setTimeout(() => {
            copyButton.textContent = "Sao chép key";
          }, 1500);
        } catch {
          copyButton.textContent = "Không sao chép được";
        }
      });

      void start();
    </script>
  </body>
</html>
